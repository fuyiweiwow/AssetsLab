<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Miku 睫毛参考贴合工具</title>
  <style>
    :root { color-scheme: dark; --bg:#0d1320; --panel:#172235; --line:#344663; --text:#f2f6ff; --muted:#aebdd3; --accent:#76d4ff; --pink:#ff82ba; --danger:#ff9b9b; }
    * { box-sizing:border-box; }
    body { margin:0; background:linear-gradient(135deg,#0b101b,#1b2a45); color:var(--text); font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; }
    main { width:min(1500px,100%); margin:auto; padding:18px 16px 40px; }
    h1 { margin:0 0 4px; font-size:clamp(22px,4vw,34px); }
    h2 { margin:0; font-size:18px; }
    p { margin:5px 0; color:var(--muted); }
    code { color:#d9f4ff; word-break:break-word; }
    .toolbar, .control-row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
    .toolbar { margin:14px 0 12px; }
    button, input { font:inherit; }
    button { cursor:pointer; color:var(--text); background:#253653; border:1px solid #4c6387; border-radius:8px; padding:7px 11px; }
    button:hover, button.active { background:#31547c; border-color:var(--accent); }
    button.primary { background:#17627f; border-color:#83dcff; }
    button.danger { border-color:#8c5264; }
    .layout { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:14px; align-items:start; }
    .panel { border:1px solid var(--line); border-radius:13px; background:rgba(23,34,53,.96); padding:12px; }
    .panel-head { display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:8px; }
    .hint { min-height:42px; font-size:13px; color:var(--muted); }
    .canvas-wrap { position:relative; background:#080d17; border:1px solid #2f415d; border-radius:9px; overflow:hidden; }
    canvas { display:block; width:100%; height:auto; aspect-ratio:1.1; cursor:crosshair; touch-action:none; }
    #targetCanvas { cursor:grab; }
    #targetCanvas.dragging { cursor:grabbing; }
    .zoom-line { display:grid; grid-template-columns:auto 1fr auto; gap:8px; align-items:center; margin-top:9px; color:var(--muted); font-size:13px; }
    input[type=range] { width:100%; accent-color:var(--accent); }
    .bottom { display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:14px; margin-top:14px; }
    .pieces { min-height:72px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
    .piece { display:flex; gap:6px; align-items:center; }
    .piece button { padding:5px 8px; }
    .piece button.selected { border-color:var(--pink); background:#6c345b; }
    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    label { display:grid; gap:3px; color:var(--muted); font-size:13px; }
    input[type=number] { width:100%; min-width:0; padding:6px 7px; color:var(--text); background:#101a2b; border:1px solid #415573; border-radius:7px; }
    .status { color:#b8f2c7; min-height:22px; }
    .warning { color:#ffd99b; }
    .legend { display:flex; gap:12px; flex-wrap:wrap; color:var(--muted); font-size:12px; margin-top:8px; }
    .swatch { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:4px; }
    .red { background:#ff5b78; } .cyan { background:var(--accent); } .pink { background:var(--pink); }
    @media (max-width:900px) { .layout, .bottom { grid-template-columns:1fr; } }
  </style>
</head>
<body>
<main id="lashTool">
  <h1>Miku 睫毛参考贴合工具</h1>
  <p>在左图圈出一只眼的上睫毛，抠出后拖到右图演员脸上。建议左右睫毛分别操作。</p>

  <div class="toolbar" aria-label="主要操作">
    <button id="finishBtn" class="primary">完成圈选并生成部件</button>
    <button id="extractBtn" class="primary">重新抠取当前圈选</button>
    <button id="clearBtn">清除当前圈选</button>
    <button id="undoBtn">撤销上一个点</button>
    <button id="resetBtn" class="danger">重置工具</button>
    <button id="exportBtn">导出合成 PNG</button>
    <button id="jsonBtn">导出标注 JSON</button>
  </div>

  <div class="layout">
    <section class="panel">
      <div class="panel-head"><h2>1. Miku 正面参考</h2><span class="warning">点击添加多边形点</span></div>
      <div class="hint">沿着一只上睫毛的外轮廓依次点击，尽量只圈住睫毛，不要把眉毛和眼球一起圈进去。双击或点击“完成圈选”闭合。</div>
      <div class="canvas-wrap"><canvas id="sourceCanvas" width="900" height="820" aria-label="Miku 正面参考图和睫毛圈选区域"></canvas></div>
      <div class="zoom-line"><span>参考图缩放</span><input id="sourceZoom" type="range" min="0.5" max="2.8" step="0.01" value="1"><output id="sourceZoomValue">100%</output></div>
      <div class="legend"><span><i class="swatch red"></i>当前圈选</span><span>鼠标滚轮也可缩放左图</span></div>
    </section>

    <section class="panel">
      <div class="panel-head"><h2>2. 我们的演员正面</h2><span class="warning">拖动睫毛调整位置</span></div>
      <div class="hint">抠出后，直接在右图拖动睫毛；滚轮缩放，Shift+滚轮旋转。透明度和变换数值也可以在下方微调。</div>
      <div class="canvas-wrap"><canvas id="targetCanvas" width="900" height="820" aria-label="演员正面图和睫毛叠加预览"></canvas></div>
      <div class="zoom-line"><span>演员图缩放</span><input id="targetZoom" type="range" min="0.5" max="2.8" step="0.01" value="1"><output id="targetZoomValue">100%</output></div>
      <div class="legend"><span><i class="swatch pink"></i>当前睫毛</span><span><i class="swatch cyan"></i>拖动范围</span></div>
    </section>
  </div>

  <div class="bottom">
    <section class="panel">
      <div class="panel-head"><h2>已抠出的部件</h2><span id="pieceStatus" class="status">还没有睫毛部件</span></div>
      <div id="pieces" class="pieces"></div>
    </section>
    <section class="panel">
      <h2>当前部件变换</h2>
      <div class="form-grid" style="margin-top:9px">
        <label>X<input id="pieceX" type="number" step="1"></label>
        <label>Y<input id="pieceY" type="number" step="1"></label>
        <label>缩放<input id="pieceScale" type="number" step="0.01" min="0.05"></label>
        <label>旋转°<input id="pieceRotation" type="number" step="1"></label>
        <label>透明度<input id="pieceOpacity" type="number" step="0.01" min="0" max="1"></label>
      </div>
      <div class="control-row" style="margin-top:9px"><button id="mirrorBtn">水平翻转</button><button id="deleteBtn" class="danger">删除当前部件</button></div>
    </section>
  </div>
</main>

<script>
(() => {
  'use strict';
  const root = document.getElementById('lashTool');
  const sourceCanvas = document.getElementById('sourceCanvas');
  const targetCanvas = document.getElementById('targetCanvas');
  const sourceCtx = sourceCanvas.getContext('2d');
  const targetCtx = targetCanvas.getContext('2d');
  const sourceImage = new Image();
  const targetImage = new Image();
  sourceImage.src = 'assets/lash_reference/miku_face_front.png';
  targetImage.src = 'assets/lash_reference/actor_front.png';

  const state = {
    sourceZoom: 1, targetZoom: 1, polygon: [], polygonClosed: false,
    pieces: [], selectedPiece: -1, dragging: false, dragOffset: {x:0,y:0}
  };

  function clamp(value, min, max) { return Math.max(min, Math.min(max, value)); }
  function imageTransform(canvas, image, zoom) {
    const scale = Math.min(canvas.width / image.width, canvas.height / image.height) * zoom;
    return { scale, x: (canvas.width - image.width * scale) / 2, y: (canvas.height - image.height * scale) / 2 };
  }
  function canvasPoint(event, canvas) {
    const rect = canvas.getBoundingClientRect();
    return { x: (event.clientX - rect.left) * canvas.width / rect.width, y: (event.clientY - rect.top) * canvas.height / rect.height };
  }
  function toImagePoint(point, transform) { return { x: (point.x - transform.x) / transform.scale, y: (point.y - transform.y) / transform.scale }; }
  function fromImagePoint(point, transform) { return { x: transform.x + point.x * transform.scale, y: transform.y + point.y * transform.scale }; }
  function polygonPath(ctx, points, transform) {
    if (!points.length) return;
    const first = fromImagePoint(points[0], transform);
    ctx.beginPath(); ctx.moveTo(first.x, first.y);
    points.slice(1).forEach(point => { const p = fromImagePoint(point, transform); ctx.lineTo(p.x, p.y); });
    if (state.polygonClosed) ctx.closePath();
  }
  function drawSource() {
    sourceCtx.clearRect(0, 0, sourceCanvas.width, sourceCanvas.height);
    sourceCtx.fillStyle = '#080d17'; sourceCtx.fillRect(0, 0, sourceCanvas.width, sourceCanvas.height);
    if (!sourceImage.complete || !sourceImage.naturalWidth) return;
    const t = imageTransform(sourceCanvas, sourceImage, state.sourceZoom);
    sourceCtx.drawImage(sourceImage, t.x, t.y, sourceImage.width * t.scale, sourceImage.height * t.scale);
    if (state.polygon.length) {
      polygonPath(sourceCtx, state.polygon, t);
      sourceCtx.strokeStyle = '#ff5b78'; sourceCtx.lineWidth = 3; sourceCtx.setLineDash([8,5]); sourceCtx.stroke(); sourceCtx.setLineDash([]);
      state.polygon.forEach((point, index) => { const p = fromImagePoint(point, t); sourceCtx.beginPath(); sourceCtx.arc(p.x,p.y,index === 0 ? 7 : 5,0,Math.PI*2); sourceCtx.fillStyle = index === 0 ? '#ffd166' : '#ff5b78'; sourceCtx.fill(); });
    }
  }
  function drawTarget() {
    targetCtx.clearRect(0, 0, targetCanvas.width, targetCanvas.height);
    targetCtx.fillStyle = '#080d17'; targetCtx.fillRect(0, 0, targetCanvas.width, targetCanvas.height);
    if (!targetImage.complete || !targetImage.naturalWidth) return;
    const t = imageTransform(targetCanvas, targetImage, state.targetZoom);
    targetCtx.drawImage(targetImage, t.x, t.y, targetImage.width * t.scale, targetImage.height * t.scale);
    const piece = state.pieces[state.selectedPiece];
    if (!piece || !piece.canvas) return;
    const center = fromImagePoint({x: piece.x, y: piece.y}, t);
    targetCtx.save();
    targetCtx.globalAlpha = piece.opacity;
    targetCtx.translate(center.x, center.y); targetCtx.rotate(piece.rotation * Math.PI / 180); targetCtx.scale(piece.flip ? -piece.scale : piece.scale, piece.scale);
    targetCtx.drawImage(piece.canvas, -piece.canvas.width/2, -piece.canvas.height/2);
    targetCtx.restore();
    const halfW = piece.canvas.width * piece.scale * t.scale / 2, halfH = piece.canvas.height * piece.scale * t.scale / 2;
    targetCtx.save(); targetCtx.translate(center.x,center.y); targetCtx.rotate(piece.rotation*Math.PI/180); targetCtx.strokeStyle='#ff82ba'; targetCtx.lineWidth=2; targetCtx.setLineDash([7,4]); targetCtx.strokeRect(-halfW,-halfH,halfW*2,halfH*2); targetCtx.restore();
  }
  function render() { drawSource(); drawTarget(); }
  function updateZoomLabels() { document.getElementById('sourceZoomValue').value = Math.round(state.sourceZoom*100)+'%'; document.getElementById('targetZoomValue').value = Math.round(state.targetZoom*100)+'%'; }
  function updateInputs() {
    const piece = state.pieces[state.selectedPiece];
    ['pieceX','pieceY','pieceScale','pieceRotation','pieceOpacity'].forEach(id => document.getElementById(id).disabled = !piece);
    if (!piece) return;
    document.getElementById('pieceX').value = Math.round(piece.x); document.getElementById('pieceY').value = Math.round(piece.y); document.getElementById('pieceScale').value = piece.scale.toFixed(2); document.getElementById('pieceRotation').value = Math.round(piece.rotation); document.getElementById('pieceOpacity').value = piece.opacity.toFixed(2);
  }
  function renderPieces() {
    const list = document.getElementById('pieces'); list.innerHTML = '';
    state.pieces.forEach((piece,index) => { const wrap=document.createElement('div'); wrap.className='piece'; const button=document.createElement('button'); button.textContent=piece.name; button.className=index===state.selectedPiece?'selected':''; button.onclick=()=>{state.selectedPiece=index; updateInputs(); renderPieces(); render();}; const del=document.createElement('button'); del.textContent='×'; del.setAttribute('aria-label','删除 '+piece.name); del.onclick=()=>{state.pieces.splice(index,1); state.selectedPiece=clamp(state.selectedPiece,0,state.pieces.length-1); updateInputs(); renderPieces(); render();}; wrap.append(button,del); list.appendChild(wrap); });
    document.getElementById('pieceStatus').textContent = state.pieces.length ? `已抠出 ${state.pieces.length} 个部件，当前可拖动` : '还没有睫毛部件';
  }
  function imagePolygonBounds() { const xs=state.polygon.map(p=>p.x), ys=state.polygon.map(p=>p.y); return {minX:Math.floor(Math.min(...xs)), minY:Math.floor(Math.min(...ys)), maxX:Math.ceil(Math.max(...xs)), maxY:Math.ceil(Math.max(...ys))}; }
  function extractPiece() {
    if (!state.polygonClosed || state.polygon.length < 3) { document.getElementById('pieceStatus').textContent='请先圈选并闭合一个睫毛区域'; return; }
    const b=imagePolygonBounds(), pad=8, w=Math.max(1,b.maxX-b.minX+pad*2), h=Math.max(1,b.maxY-b.minY+pad*2), cut=document.createElement('canvas'); cut.width=w; cut.height=h; const c=cut.getContext('2d');
    c.save(); c.beginPath(); state.polygon.forEach((p,i)=>i?c.lineTo(p.x-b.minX+pad,p.y-b.minY+pad):c.moveTo(p.x-b.minX+pad,p.y-b.minY+pad)); c.closePath(); c.clip(); c.drawImage(sourceImage,-b.minX+pad,-b.minY+pad); c.restore();
    const piece={name:`睫毛${state.pieces.length+1}`,canvas:cut,x:targetImage.width/2,y:targetImage.height/2,scale:1,rotation:0,opacity:0.82,flip:false,polygon:state.polygon.map(p=>({...p}))}; state.pieces.push(piece); state.selectedPiece=state.pieces.length-1; state.polygon=[]; state.polygonClosed=false; updateInputs(); renderPieces(); render();
  }
  function finishPolygon() { if(state.polygon.length>=3) { state.polygonClosed=true; render(); } }
  sourceCanvas.addEventListener('pointerdown', event => { if(state.polygonClosed) return; const p=toImagePoint(canvasPoint(event,sourceCanvas),imageTransform(sourceCanvas,sourceImage,state.sourceZoom)); if(p.x>=0&&p.y>=0&&p.x<=sourceImage.width&&p.y<=sourceImage.height){state.polygon.push(p); render();} });
  sourceCanvas.addEventListener('dblclick', event => { event.preventDefault(); finishPolygon(); });
  targetCanvas.addEventListener('pointerdown', event => { const piece=state.pieces[state.selectedPiece]; if(!piece) return; state.dragging=true; targetCanvas.classList.add('dragging'); targetCanvas.setPointerCapture(event.pointerId); const p=toImagePoint(canvasPoint(event,targetCanvas),imageTransform(targetCanvas,targetImage,state.targetZoom)); state.dragOffset={x:p.x-piece.x,y:p.y-piece.y}; });
  targetCanvas.addEventListener('pointermove', event => { if(!state.dragging) return; const piece=state.pieces[state.selectedPiece]; const p=toImagePoint(canvasPoint(event,targetCanvas),imageTransform(targetCanvas,targetImage,state.targetZoom)); piece.x=p.x-state.dragOffset.x; piece.y=p.y-state.dragOffset.y; updateInputs(); render(); });
  targetCanvas.addEventListener('pointerup', () => { state.dragging=false; targetCanvas.classList.remove('dragging'); });
  sourceCanvas.addEventListener('wheel', event => { event.preventDefault(); state.sourceZoom=clamp(state.sourceZoom*(event.deltaY<0?1.08:0.92),0.5,2.8); document.getElementById('sourceZoom').value=state.sourceZoom; updateZoomLabels(); render(); }, {passive:false});
  targetCanvas.addEventListener('wheel', event => { event.preventDefault(); const p=state.pieces[state.selectedPiece]; if(!p) return; if(event.shiftKey) p.rotation+=event.deltaY<0?3:-3; else p.scale=clamp(p.scale*(event.deltaY<0?1.06:0.94),0.05,5); updateInputs(); render(); }, {passive:false});
  document.getElementById('finishBtn').onclick=()=>{finishPolygon(); extractPiece();}; document.getElementById('extractBtn').onclick=extractPiece; document.getElementById('clearBtn').onclick=()=>{state.polygon=[];state.polygonClosed=false;render();}; document.getElementById('undoBtn').onclick=()=>{if(!state.polygonClosed)state.polygon.pop();render();};
  document.getElementById('resetBtn').onclick=()=>{state.polygon=[];state.polygonClosed=false;state.pieces=[];state.selectedPiece=-1;state.sourceZoom=1;state.targetZoom=1;document.getElementById('sourceZoom').value=1;document.getElementById('targetZoom').value=1;updateZoomLabels();updateInputs();renderPieces();render();};
  document.getElementById('sourceZoom').oninput=e=>{state.sourceZoom=Number(e.target.value);updateZoomLabels();render();}; document.getElementById('targetZoom').oninput=e=>{state.targetZoom=Number(e.target.value);updateZoomLabels();render();};
  function bindNumber(id,key,transform=Number){document.getElementById(id).oninput=e=>{const p=state.pieces[state.selectedPiece];if(!p)return;p[key]=transform(e.target.value);render();};}
  bindNumber('pieceX','x');bindNumber('pieceY','y');bindNumber('pieceScale','scale',v=>clamp(Number(v),0.05,5));bindNumber('pieceRotation','rotation');bindNumber('pieceOpacity','opacity',v=>clamp(Number(v),0,1));
  document.getElementById('mirrorBtn').onclick=()=>{const p=state.pieces[state.selectedPiece];if(p){p.flip=!p.flip;render();}};
  document.getElementById('deleteBtn').onclick=()=>{if(state.selectedPiece<0)return;state.pieces.splice(state.selectedPiece,1);state.selectedPiece=clamp(state.selectedPiece,0,state.pieces.length-1);updateInputs();renderPieces();render();};
  function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
  document.getElementById('exportBtn').onclick=()=>{const out=document.createElement('canvas');out.width=targetCanvas.width;out.height=targetCanvas.height;const c=out.getContext('2d');c.drawImage(targetCanvas,0,0);out.toBlob(blob=>download(blob,'miku_lash_overlay_on_actor.png'),'image/png');};
  document.getElementById('jsonBtn').onclick=()=>{const data={schema:'assetslab_miku_lash_overlay_v1',source:'miku_face_front.png',target:'actor_front.png',pieces:state.pieces.map(p=>({name:p.name,x:p.x,y:p.y,scale:p.scale,rotation:p.rotation,opacity:p.opacity,flip:p.flip,polygon:p.polygon}))};download(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),'miku_lash_overlay.json');};
  [sourceImage,targetImage].forEach(image=>image.onload=render); updateZoomLabels(); updateInputs(); renderPieces(); render();
})();
</script>
</body>
</html>
